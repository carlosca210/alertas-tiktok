<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        /* Forzamos que el fondo no sea negro para ver si el video aparece */
        body { 
            margin: 0; 
            background-color: rgba(0, 0, 0, 0.1); 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container { 
            width: 800px; /* Tamaño fijo para la prueba */
            height: 600px;
            border: 2px solid red; /* Si ves este cuadro rojo, el contenedor está bien */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        video { 
            display: none; 
            width: 100%; 
            height: 100%;
            object-fit: contain; /* Para que no se deforme */
            background: black;  /* Fondo interno del video */
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="alertVideo"></video>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const video = document.getElementById('alertVideo');

        // 1. CONFIGURACIÓN: Aquí añades todos los regalos que quieras
        // Asegúrate de que el nombre coincida con lo que ves en los logs de Render
        const library = {
            "Rosa": { archivo: "videos/rosa.mp4", volumen: 0.1 },
            "Rose": { archivo: "videos/rosa.mp4", volumen: 0.1 }, // Para la rosa pequeña
            "Weights": { archivo: "videos/pesa.mp4", volumen: 0.5 },
            "Ice Cream": { archivo: "videos/helado.mp4", volumen: 0.3 },
            "TikTok": { archivo: "videos/tiktok.mp4", volumen: 0.2 },
            "Dragon": { archivo: "videos/dragon.mp4", volumen: 1.0 }
        };

        // --- NUEVA LÓGICA DE COLA ---
        let colaAlertas = []; // Aquí se guardarán los regalos que lleguen
        let estaReproduciendo = false; // "Semáforo" para saber si el video está ocupado

        socket.on('show-alert', (data) => {
            console.log("Señal recibida para:", data.gift);

            // Si el regalo está en la librería, lo metemos a la fila
         if (library[data.gift]) {
             colaAlertas.push(data.gift);
             procesarSiguiente(); // Intentamos reproducir
         } else {
             console.log(`El regalo "${data.gift}" no tiene video asignado.`);
          }
        });

        function procesarSiguiente() {
            // Si ya hay un video en pantalla o no hay nadie en la fila, nos detenemos
            if (estaReproduciendo || colaAlertas.length === 0) return;

            estaReproduciendo = true;
            const nombreRegalo = colaAlertas.shift(); // Sacamos el primer regalo de la fila
            const alertData = library[nombreRegalo];

            console.log(`Reproduciendo ahora: ${nombreRegalo}. Quedan en espera: ${colaAlertas.length}`);

            // Configuramos el video
            video.src = alertData.archivo;
            video.volume = alertData.volumen;
            video.style.display = "block";

            video.play().catch(e => {
                console.error("Error al reproducir:", e);
                terminarAlerta(); // Si falla, pasamos al siguiente para no trabar la cola
            });

            // IMPORTANTE: Cuando el video termina, buscamos el siguiente
            video.onended = () => {
               terminarAlerta();
            };
        }

        function terminarAlerta() {
            video.style.display = "none";
            video.src = "";
            estaReproduciendo = false; // Liberamos el "semáforo"
            procesarSiguiente(); // Revisamos si hay más regalos en la fila
        }
        // --- FIN DE LA LÓGICA DE COLA ---
    </script>
</body>
</html>
