<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        /* Forzamos opacidad y transparencia absoluta en html y body */
        html, body { 
            margin: 0; 
            padding: 0;
            background: transparent !important;
            background-color: rgba(0, 0, 0, 0) !important;
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent !important;
        }

        video { 
            display: none; 
            width: 100%; 
            height: 100%;
            object-fit: contain; 
            background: transparent !important;
            outline: none;
            border: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="alertVideo"></video>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const video = document.getElementById('alertVideo');

        // 1. CAPTURAR EL SCREEN DESDE LA URL (Ej: http://localhost:10000/?screen=screen1)
        const urlParams = new URLSearchParams(window.location.search);
        const miPantalla = urlParams.get('screen') || 'screen1';

        console.log(`📡 Esta ventana está escuchando eventos para: [${miPantalla}]`);

        // Librería dinámica enviada por el servidor (Estructura: { alert_1: {...}, alert_2: {...} })
        let library = {};

        // 2. VARIABLES DE COLA Y CONTROL DE TIEMPO
        let colaAlertas = [];
        let estaReproduciendo = false;
        let timerDuracion = null;
        
        // Historial de IDs procesados para evitar retransmisiones del socket
        const idsProcesados = new Set();
        const MAX_HISTORIAL_IDS = 100;

        // Escuchar actualización de librería
        socket.on('update-library', (newLib) => {
            if (newLib && Object.keys(newLib).length > 0) {
                library = newLib;
                console.log("🔄 Configuración de alertas sincronizada en index.html:", library);
            }
        });

        socket.on('connect', () => {
            console.log("✅ Conectado al socket servidor.");
        });

        // Limpiamos listeners previos para evitar duplicación por reconexión
        socket.off('show-alert');

        socket.on('show-alert', (data) => {
            // Filtro por ID único para evitar duplicados de red
            if (data.msgId && idsProcesados.has(data.msgId)) {
                console.warn("⚠️ Evento duplicado de red ignorado (msgId repetido):", data.msgId);
                return;
            }

            // Obtener la configuración directa que envía server.js o buscar por alertId en la librería
            const itemConfig = data.config || library[data.alertId];

            // 1. Validar si existe la configuración de la alerta
            if (!itemConfig) {
                console.log(`La alerta "${data.alertId || data.gift}" no tiene configuración asignada.`);
                return;
            }

            // 2. FILTRO DE PANTALLA (SCREEN)
            if (itemConfig.screen !== miPantalla) {
                console.log(`Alerta "${itemConfig.giftName || data.gift}" ignorada (es para ${itemConfig.screen}, esta ventana es ${miPantalla}).`);
                return;
            }

            // Registrar el ID procesado
            if (data.msgId) {
                idsProcesados.add(data.msgId);
                if (idsProcesados.size > MAX_HISTORIAL_IDS) {
                    const primerElemento = idsProcesados.values().next().value;
                    idsProcesados.delete(primerElemento);
                }
            }

            console.log(`✅ Alerta aceptada en [${miPantalla}]:`, itemConfig.giftName || data.gift);

            // Meter a la cola con los datos de volumen y duración dinámicos
            colaAlertas.push({
                nombre: itemConfig.giftName || data.gift,
                archivo: itemConfig.archivo,
                volumen: itemConfig.volumen ?? 0.5,
                duracion: itemConfig.duracion ?? 5
            });

            procesarSiguiente();
        });

        function procesarSiguiente() {
            if (estaReproduciendo || colaAlertas.length === 0) return;

            estaReproduciendo = true;
            const alertaActual = colaAlertas.shift();

            console.log(`Reproduciendo: ${alertaActual.nombre} | Vol: ${alertaActual.volumen} | Duración: ${alertaActual.duracion}s`);

            video.src = alertaActual.archivo;
            video.volume = alertaActual.volumen;
            video.style.display = "block";

            video.play().catch(e => {
                console.error("Error al reproducir:", e);
                terminarAlerta();
            });

            // TEMPORIZADOR DE CORTE POR DURACIÓN
            if (timerDuracion) clearTimeout(timerDuracion);

            if (alertaActual.duracion && alertaActual.duracion > 0) {
                timerDuracion = setTimeout(() => {
                    console.log(`⏱️ Límite de ${alertaActual.duracion}s alcanzado. Cortando alerta...`);
                    terminarAlerta();
                }, alertaActual.duracion * 1000);
            }

            video.onended = () => {
                terminarAlerta();
            };
        }

        function terminarAlerta() {
            if (timerDuracion) clearTimeout(timerDuracion);
            video.style.display = "none";
            video.src = "";
            estaReproduciendo = false;
            procesarSiguiente();
        }

        socket.on('force-stop-alerts', () => {
            console.warn("🛑 Limpiando cola y deteniendo reproducción por orden remota.");
            if (timerDuracion) clearTimeout(timerDuracion);
            colaAlertas = [];
            video.pause();
            video.currentTime = 0;
            video.src = "";
            video.style.display = "none";
            estaReproduciendo = false;
        });
    </script>
</body>
</html>
